<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JelSmart - Tükör</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="{{ url_for('static', filename='img/header.png') }}" alt="JelSmart Logo" class="logo" style="height: 40px;"> JelSmart
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/lecke">Leckék</a></li>
        <li class="nav-item"><a class="nav-link" href="/tukor">Tükör</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container mt-5">
  <h1>Tükör</h1>
  <p>Gyakorold a daktil jeleket valós időben!</p>
  <video id="mirrorVideo" autoplay playsinline class="img-fluid mb-3" style="transform: scaleX(-1); max-width: 480px;"></video>
  <div id="result" class="alert alert-info" role="alert" style="display:none;"></div>
  <button id="startBtn" class="btn btn-primary me-2">Indítás</button>
  <button id="stopBtn" class="btn btn-secondary">Leállítás</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Inject the server-side API URL so tukor.js always POSTs to the right origin -->
<script>window.JELSMART_API_URL = "{{ api_url }}/api/tukor";</script>
<script src="{{ url_for('static', filename='js/tukor.js') }}"></script>
</body>
</html>
