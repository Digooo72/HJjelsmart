<!DOCTYPE html> <html lang="hu"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, 
    initial-scale=1.0"> <title>JelSmart - Leckék</title> <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <link rel="stylesheet" 
    href="{{ url_for('static', filename='css/style.css') }}"> <link rel="icon" type="image/x-icon" href="{{ url_for('static', 
    filename='img/favicon.ico') }}">
</head> <body> <nav class="navbar navbar-expand-lg navbar-light bg-light"> <div class="container"> <a class="navbar-brand" 
            href="/">
                <img src="{{ url_for('static', filename='img/header.png') }}" alt="JelSmart Logo" class="logo"> JelSmart </a> 
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span> </button> <div class="collapse navbar-collapse" id="navbarNav"> <ul 
                class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/lecke">Leckék</a></li> <li class="nav-item"><a 
                    class="nav-link" href="/tukor">Tükör</a></li>
                </ul> </div> </div> </nav> <div class="container mt-5"> <h1>Leckék</h1> {% if error %} <div class="alert 
            alert-danger">{{ error }}</div>
        {% endif %} {% if lessons %} <div class="row"> {% for lesson in lessons %} <div class="col-md-4"> <div class="card"> <div 
                            class="card-body">
                                <h5 class="card-title">{{ lesson[1] }}</h5> <p class="card-text">{{ lesson[2] or 'Nincs leírás' 
                                }}</p>
                            </div> </div> </div> {% endfor %} </div> {% else %} <p class="text-center">Nincsenek elérhető 
            leckék.</p>
        {% endif %} <div class="text-center mt-4"> <img src="{{ url_for('static', filename='img/full_logo.png') }}" alt="Header 
            Image" class="img-fluid" style="max-width: 200px; margin-bottom: 20px;">
        </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> </body>
</html>
