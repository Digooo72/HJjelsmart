<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../static/images/favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="../static/images/favicon-16x16.png" sizes="16x16"/>
    <title>Feladatok</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            background: #f0f2f5 !important;
        }

        .img {
            max-width: 200px;
            height: auto;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            align-self: center;
        }

        .video-container {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        video {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        a.btn-video {
            margin-top: 20px;
        }

        .description {
            align-self: center;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .btn {
            background-color: #007bff !important;
            color: #fff !important;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600 !important;
            border-radius: 16px !important;
            text-decoration: none;
            transition: background-color 0.3s ease;
            display: inline-block;
            width: 240px;
            margin: 10px;
        }

        .btn:hover {
            background-color: #0056b3 !important;
        }

        .button-container {
            text-align: center;
        }
    </style>
</head>


<body>

{% include 'navbar.html' %}

<div class="content-wrapper">
    <h1 class="description mb-3">{{ task.task_description_letter }}</h1>
    <img class="img" src="{{ url_for('media_bp.images', filename=task.task_image) }}"
         alt="{{ task.task_description_letter }}">

    <div class="video-container d-flex justify-content-center">
        <video controls style="width: 90%; max-width: 900px;">
            <source src="{{ url_for('media_bp.videos', filename=task.task_video_url) }}" type="video/mp4">
        </video>
    </div>

    <div class="button-container">
        <a id="prevLesson" class="btn">
            <i class="fas fa-arrow-left"></i> Előző lecke
        </a>
        <a id="back" class="btn">
            <i class="fas fa-book-open"></i> Vissza a feladatokhoz
        </a>
        <a id="nextLesson" class="btn">
            Következő lecke <i class="fas fa-arrow-right"></i>
        </a>
    </div>
</div>
{% include 'footer.html' %}
</body>
</html>

<script>
    const sessionData = JSON.parse(sessionStorage.getItem('lesson')) || {
        ids: [],
        filter: null,
        page: null
    };
    const lessonIds = sessionData.ids;
    const currentLessonId = parseInt(window.location.pathname.split('/').pop());
    const currentIndex = lessonIds.indexOf(currentLessonId);

    if (currentIndex > 0) {
        document.getElementById('prevLesson').href = `/lecke/${lessonIds[currentIndex - 1]}`;
    } else {
        document.getElementById('prevLesson').classList.add('disabled');
    }

    if (currentIndex < lessonIds.length - 1) {
        document.getElementById('nextLesson').href = `/lecke/${lessonIds[currentIndex + 1]}`;
    } else {
        document.getElementById('nextLesson').classList.add('disabled');
    }

    if (sessionData && sessionData.page) {
        document.getElementById('back').href = sessionData.page;
    } else {
        document.getElementById('back').classList.add('disabled');
    }
</script>
