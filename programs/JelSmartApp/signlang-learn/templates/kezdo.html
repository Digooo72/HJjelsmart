<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/png" href="static/images/favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="static/images/favicon-16x16.png" sizes="16x16"/>
    <title>Kezdő</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            background: #f0f2f5 !important;
        }

        h1 {
            width: 100%;
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 280px;
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 1rem;
            border: 2px solid #007bff;
        }

        .description-letter {
            font-size: 2rem;
            font-weight: 700;
            color: #007bff;
            margin-bottom: 0.5rem;
        }

        .description-text {
            font-size: 1rem;
            color: #555;
            margin-bottom: 1rem;
            min-height: 60px;
        }

        .difficulty-id {
            font-weight: 600;
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 1rem;
        }

        .btn {
            background-color: #007bff !important;
            color: #fff !important;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600 !important;
            border-radius: 25px !important;
            text-decoration: none;
            transition: background-color 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            background-color: #0056b3 !important;
        }

        .level-container {
            flex-wrap: wrap;
            gap: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .level-container-empty {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            flex: 1;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="static/js/filter.js" defer></script>
</head>
<body>

{% include 'navbar.html' %}

<div class="content-wrapper">
    <h1>Kezdő</h1>

    {% if beginner %}
    <div class="search-container text-center mb-4">
        <input type="text" id="searchInput" class="form-control w-50 mx-auto"
               placeholder="Keresés kategóriák között...">
    </div>

    <div class="level-container mt-5" id="cardContainer">
        {% for row in beginner %}
        <div class="card">
            <img src="/static/images/{{ row.image }}" alt={{row.description_letter}}/>
            <div class="description-letter">{{ row.task_description_letter }}</div>
            <div class="description-text">{{ row.task_description }}</div>
            <div class="difficulty-id">Szint: {{ row.task_difficulty_id }}</div>
            <a id="details" href="{{ url_for('neutral.lecke', lecke_id=row.task_id) }}" class="btn">
                Részletek
            </a>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="level-container-empty mt-5">
        <div class="badge-container">
            <p class="badge bg-info">Nem található feladatsor!</p>
        </div>
    </div>
    {% endif %}
</div>
{% include 'footer.html' %}
</body>
</html>
